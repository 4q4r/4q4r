name: Metrics
on:
  schedule: [{ cron: "0 */4 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General metrics
        uses: 4q4r/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_details: yes
          plugin_introduction: yes
          filename: metrics.general.svg

      - name: Shikimori metrics
        uses: 4q4r/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: ""
          plugin_shikimori: yes
          plugin_shikimori_user: whynothacked
          filename: metrics.shikimori.svg

      - name: Notable contributions
        uses: 4q4r/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: ""
          plugin_notable: yes
          plugin_notable_repositories: yes
          filename: metrics.notable.svg

      - name: Featured repositories
        uses: 4q4r/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: ""
          plugin_repositories: yes
          plugin_repositories_starred: 6
          filename: metrics.repositories.svg

      - name: Repository traffic
        uses: 4q4r/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: ""
          plugin_traffic: yes
          filename: metrics.traffic.svg